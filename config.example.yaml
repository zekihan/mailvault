sources:
  - name: gmail
    type: imap
    host: imap.gmail.com
    port: 993
    username: user@gmail.com
    password_ref: "env:GMAIL_PASSWORD"
    use_tls: true
    folders:
      - INBOX
      - "[Gmail]/Sent Mail"
      - "[Gmail]/Starred"
    connection_timeout: 30s
    read_timeout: 60s
    # Per LIST/SEARCH/UIDL response; POP3 STAT counts share the item limit.
    max_listing_items: 1000000
    max_listing_bytes: 67108864
    max_connections: 5

  - name: outlook
    type: imap
    host: outlook.office365.com
    port: 993
    username: user@outlook.com
    use_tls: true
    oauth2:
      # Register a public client in Microsoft Entra and put its client ID here.
      client_id: "YOUR_MICROSOFT_PUBLIC_CLIENT_ID"
      tenant: consumers
      # Tokens are kept in the OS keyring under a host/account-derived key.
    folders:
      - INBOX
      - Sent Items
    max_connections: 5

targets:
  - name: local_maildir
    type: maildir
    config:
      path: "~/mail/backup"
      create_if_missing: true
      preserve_folders: true
      preserve_flags: true

  - name: local_mbox
    type: mbox
    config:
      path: "~/mail/backup.mbox"
      create_if_missing: true

pairs:
  - source: gmail
    targets:
      - local_maildir
      - local_mbox

  - source: outlook
    targets:
      - local_maildir
