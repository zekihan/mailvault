image:
  repository: ghcr.io/zekihan/mailvault
  # Defaults to the chart appVersion; override when installing from source.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Optional startup checks for scheduled backup pods only.
initContainers: []
# Secret containing config.yaml and any file-referenced credentials under /config.
configSecret: mailvault-config
# Secret keys exposed as regular files at /credentials/<key> using read-only
# subPath mounts. Reference those paths in config.yaml. Each new pod receives
# the current Secret; existing pods do not receive projected updates.
credentialFiles: []
schedule: '0 3 * * *'
timeZone: Etc/UTC
suspend: true
# Interactive Mailvault setup for OAuth login; disable before running backup Jobs.
setup:
  enabled: false
# Explicit acknowledgement after completing setup and a successful manual backup.
initialized: false
activeDeadlineSeconds: 14400
backoffLimit: 0
# Scheduled backups and the Mailvault setup Deployment run as a fixed non-root
# user, matching the image user (UID/GID 65532). /state and /backups must be
# owned by this UID (or otherwise writable) before upgrading. Do not set fsGroup:
# it makes /state group-writable and OAuth token files 0660, which the token
# store rejects. Set a key to null to drop it, for example runAsNonRoot.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
# Size memory for max_message_bytes and max_connections in the config Secret.
# Source backpressure bounds live message count; target encoding adds overhead.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
persistence:
  state:
    labels: {}
    annotations: {}
    existingClaim: ""
    size: 1Gi
    storageClass: null
    accessModes: [ReadWriteOnce]
  backups:
    labels: {}
    annotations: {}
    existingClaim: ""
    size: 20Gi
    storageClass: null
    accessModes: [ReadWriteOnce]
proton:
  enabled: false
  # Setup mode scales Bridge to zero and creates an interactive setup Deployment.
  setup: true
  image:
    repository: ghcr.io/zekihan/protonmailbridge
    tag: 3.27.1-r2
    digest: ""
    pullPolicy: IfNotPresent
  # Secret keys: tls.crt, tls.key, ca.crt. Certificate SAN must match the Service.
  tlsSecret: mailvault-proton-tls
  # Metadata annotations for the persistent Bridge Deployment, for example a
  # reload controller that restarts Bridge when tlsSecret changes.
  annotations: {}
  persistence:
    labels: {}
    annotations: {}
    existingClaim: ""
    size: 20Gi
    storageClass: null
    accessModes: [ReadWriteOnce]
  networkPolicy: true
  # Bridge runs as the image user (UID/GID 65532) with its state mounted at /root,
  # where its vault records absolute paths. The state volume must be owned by this
  # UID before upgrading. Do not set fsGroup: gpg-agent rejects a group-accessible
  # home directory. Set a key to null to drop it, for example runAsNonRoot.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  # Also applies to the interactive setup Deployment, where the initial mailbox
  # synchronization runs. Bridge caps sync memory at about 2Gi based on host RAM.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
