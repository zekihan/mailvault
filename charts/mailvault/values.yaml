image:
  repository: ghcr.io/zekihan/mailvault
  # Defaults to the chart appVersion; override when installing from source.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Optional startup checks for scheduled backup pods only.
initContainers: []
# Secret containing config.yaml and any file-referenced credentials under /config.
configSecret: mailvault-config
# Secret keys exposed as regular files at /credentials/<key> using read-only
# subPath mounts. Reference those paths in config.yaml. Each new pod receives
# the current Secret; existing pods do not receive projected updates.
credentialFiles: []
schedule: '0 3 * * *'
timeZone: Etc/UTC
suspend: true
# Interactive Mailvault setup for OAuth login; disable before running backup Jobs.
setup:
  enabled: false
# Explicit acknowledgement after completing setup and a successful manual backup.
initialized: false
activeDeadlineSeconds: 14400
backoffLimit: 0
# Size memory for max_message_bytes and max_connections in the config Secret.
# Source backpressure bounds live message count; target encoding adds overhead.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
persistence:
  state:
    labels: {}
    existingClaim: ""
    size: 1Gi
    storageClass: null
    accessModes: [ReadWriteOnce]
  backups:
    labels: {}
    existingClaim: ""
    size: 20Gi
    storageClass: null
    accessModes: [ReadWriteOnce]
proton:
  enabled: false
  # Setup mode scales Bridge to zero and creates an interactive setup Deployment.
  setup: true
  image:
    repository: ghcr.io/zekihan/protonmailbridge
    tag: 3.27.1-r1
    digest: ""
    pullPolicy: IfNotPresent
  # Secret keys: tls.crt, tls.key, ca.crt. Certificate SAN must match the Service.
  tlsSecret: mailvault-proton-tls
  persistence:
    labels: {}
    existingClaim: ""
    size: 20Gi
    storageClass: null
    accessModes: [ReadWriteOnce]
  networkPolicy: true
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
