{{- if .Values.setup.enabled }}
{{- $name := include "mailvault.name" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-setup
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mailvault
      app.kubernetes.io/purpose: setup
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mailvault
        app.kubernetes.io/purpose: setup
    spec:
      restartPolicy: Always
      automountServiceAccountToken: false
      imagePullSecrets: {{ .Values.imagePullSecrets | toJson }}
      containers:
        - name: mailvault
          image: {{ include "mailvault.image" (merge (dict "defaultTag" .Chart.AppVersion) .Values.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources: {{ .Values.resources | toJson }}
          {{- if .Values.proton.enabled }}
          env:
            - name: SSL_CERT_FILE
              value: /bridge-ca/ca.crt
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: state
              mountPath: /state
            - name: backups
              mountPath: /backups
            {{- if .Values.proton.enabled }}
            - name: bridge-ca
              mountPath: /bridge-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          secret:
            secretName: {{ .Values.configSecret }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "mailvault.claim" (dict "settings" .Values.persistence.state "name" (printf "%s-state" $name)) }}
        - name: backups
          persistentVolumeClaim:
            claimName: {{ include "mailvault.claim" (dict "settings" .Values.persistence.backups "name" (printf "%s-backups" $name)) }}
        {{- if .Values.proton.enabled }}
        - name: bridge-ca
          secret:
            secretName: {{ .Values.proton.tlsSecret }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
{{- end }}
