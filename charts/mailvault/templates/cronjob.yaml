{{- $name := include "mailvault.name" . }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  suspend: {{ .Values.suspend }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      backoffLimit: {{ .Values.backoffLimit }}
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: mailvault
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets: {{ .Values.imagePullSecrets | toJson }}
          containers:
            - name: mailvault
              image: {{ include "mailvault.image" .Values.image | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args: ["--config", "/config/config.yaml", "--state-dir", "/state", "sync"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources: {{ .Values.resources | toJson }}
              {{- if .Values.proton.enabled }}
              env:
                - name: SSL_CERT_FILE
                  value: /bridge-ca/ca.crt
              {{- end }}
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: state
                  mountPath: /state
                - name: backups
                  mountPath: /backups
                {{- if .Values.proton.enabled }}
                - name: bridge-ca
                  mountPath: /bridge-ca
                  readOnly: true
                {{- end }}
          volumes:
            - name: config
              secret:
                secretName: {{ .Values.configSecret }}
            - name: state
              persistentVolumeClaim:
                claimName: {{ include "mailvault.claim" (dict "settings" .Values.persistence.state "name" (printf "%s-state" $name)) }}
            - name: backups
              persistentVolumeClaim:
                claimName: {{ include "mailvault.claim" (dict "settings" .Values.persistence.backups "name" (printf "%s-backups" $name)) }}
            {{- if .Values.proton.enabled }}
            - name: bridge-ca
              secret:
                secretName: {{ .Values.proton.tlsSecret }}
                items:
                  - key: ca.crt
                    path: ca.crt
            {{- end }}
