# golangci-lint config for mailvault.
# Source tier: zekihan/portfolio-tracker .golangci.yaml at commit ca39ad411df91c4e6fff2836579918638f95007f
# (most restrictive passing config surveyed for OPS-529; per-repo copy, no shared-config convention).
# Adapted for this module: gci prefix, gofumpt module-path, goimports local-prefixes, and the
# tagliatelle path exclusion (internal/sync/result.go: the "Errors" JSON key is wire-compat and
# matches the untagged PascalCase fields of SyncResult).
version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false

run:
  timeout: 5m
  tests: true
  allow-parallel-runners: true
  # Default: 0 (automatically set to match Linux container CPU quota and
  concurrency: 0

formatters:
  # OPS-529 Option B: only gofmt is enabled. The tier's other formatters
  # (gci, gofumpt, golines, swaggo) are disabled for mailvault because applying
  # them reformats ~190 files (mass churn); the repo's existing gate
  # (gofmt -l in Makefile and CI) remains gofmt.
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
        - pattern: 'a[b:len(a)]'
          replacement: 'a[b:]'
  exclusions:
    generated: lax

linters:
  default: all
  disable:
    - cyclop # duplicate of gocyclo
    - exhaustruct
    - exhaustruct_v5 # v2 name used by newer golangci-lint releases
    - gochecknoglobals
    - gochecknoinits
    - wsl
    - goheader
    - testpackage
    - gomodguard
    # OPS-529 Option B (coordinator decision): disabled linters whose natural fix is
    # mass stylistic churn across the codebase with no semantic value. Everything
    # else stays enabled and its findings are fixed in code.
    - wsl_v5
    - nlreturn
    - noinlineerr
    - wrapcheck
    - err113
    - lll
  settings:
    tagliatelle:
      case:
        use-field-name: true
        rules:
          json: snake
          # mailvault's user-facing config files use snake_case YAML keys
          # (config.example.yaml, config.test.yaml), so yaml follows json.
          yaml: snake
    depguard:
      rules:
        main:
          deny:
            - pkg: math/rand$
              desc: use math/rand/v2
            - pkg: github.com/pkg/errors
              desc: Should be replaced by standard lib errors package
            - pkg: io/ioutil
              desc: deprecated — use `os.ReadFile`, `io.NopCloser`, etc.
            - pkg: github.com/stretchr/testify
              desc: avoid in core logic — use cmp or standard assertions
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - fmt.Fprintln
      verbose: true
    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true
      allowed-errors: [ ]
      allowed-errors-wildcard: [ ]
    exhaustive:
      check:
        - switch
        - mapliteral
      default-case-required: true
    forbidigo:
      forbid:
        - pattern: ^log\.Print.*$
          msg: Use structured logger (e.g., zap, slog), not log.Print*

        - pattern: ^log\.Fatal.*$
          msg: Do not use log.Fatal — it exits the program. Prefer error handling.

        - pattern: ^os\.Exit$
          msg: Do not use os.Exit — handle errors gracefully instead.

        - pattern: ^time\.Sleep$
          msg: Avoid time.Sleep in production code — use context with timeout or ticker.

        - pattern: ^runtime\.Goexit$
          msg: Avoid abrupt goroutine exits.

        - pattern: ^context\.TODO$
          msg: Use context.WithCancel/Timeout/Background, not context.TODO in prod.
    funlen:
      lines: -1
      statements: 120
    gochecksumtype:
      default-signifies-exhaustive: false
      include-shared-interfaces: true
    goconst:
      min-len: 3
      min-occurrences: 4
    gocritic:
      enable-all: true
      disabled-checks:
        - unnamedResult
    gocyclo:
      min-complexity: 14
    godox:
      keywords:
        - FIXME
    gomoddirectives:
      toolchain-pattern: go1\.\d+\.\d+$
      tool-forbidden: true
      go-version-pattern: ^1\.\d+\.\d+$
      replace-allow-list: [ ]
    gosec:
      excludes:
        - G117 # Potential exposure of secrets via JSON marshaling
        - G703
        - G704
      config:
        G104:
          fmt:
            - Fscanf
          os:
            - Close
            - Setenv
            - Unsetenv
    govet: # default checks only (enable-all yields mass churn with no semantic value, OPS-529 Option B)
      enable-all: false
    godot:
      scope: noinline
      period: true
      capital: true
    iface:
      enable:
        - identical
        - unused
        - opaque
        - unexported
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        - UniversalClient
        - Getter
        # OPS-529 tier adaptation (repo-specific): plugin factories/store
        # return their plugin interfaces by design; test helpers return
        # fixture writer interfaces. Mirrors UniversalClient/Getter.
        - Source
        - Target
        - Store
        - CredentialsProvider
        - MailboxAppender
        - backupWriter
        # OPS-529 tier adaptation: restore MailboxAppender is a close-style plugin interface returned by constructor helpers by design.
        - MailboxAppender
    paralleltest:
      ignore-missing: true
    varnamelen:
      max-distance: 6
      min-name-length: 2
      check-receiver: true
      check-return: true
      check-type-param: true
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names:
        - err
      ignore-decls:
        - c echo.Context
        - t testing.T
        - f *foo.Bar
        - f func()
        - e error
        - i int
        - j int
        - const C
        - T any
        - m map[string]int
        - r *http.Request
        - w http.ResponseWriter
        - r *Reader
        - w *Writer
        - r *bufio.Reader
        - w *bufio.Writer
    importas:
      no-unaliased: true
      alias:
        # Standard Kubernetes rewrites:
        - pkg: k8s.io/api/core/v1
          alias: corev1
        - pkg: k8s.io/api/networking/v1
          alias: netv1
        - pkg: k8s.io/api/networking/v1beta1
          alias: netv1beta1
        - pkg: k8s.io/api/admission/v1
          alias: admv1
        - pkg: k8s.io/api/admission/v1beta1
          alias: admv1beta1
        - pkg: k8s.io/api/extensions/v1beta1
          alias: extv1beta1
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: metav1
        - pkg: k8s.io/apimachinery/pkg/types
          alias: ktypes
        - pkg: k8s.io/apimachinery/pkg/api/errors
          alias: kerror
        - pkg: k8s.io/client-go/kubernetes
          alias: kclientset
        - pkg: k8s.io/client-go/informers
          alias: kinformers
        - pkg: k8s.io/client-go/testing
          alias: ktesting
        - pkg: k8s.io/apimachinery/pkg/runtime/schema
          alias: kschema
        - pkg: k8s.io/client-go/kubernetes/scheme
          alias: kscheme
        - pkg: k8s.io/apimachinery/pkg/version
          alias: kversion
        - pkg: k8s.io/client-go/kubernetes/fake
          alias: kubefake
        - pkg: k8s.io/client-go/discovery/fake
          alias: discoveryfake

        # Kubernetes Gateway rewrites:
        - pkg: sigs.k8s.io/gateway-api/pkg/client/clientset/gateway/versioned
          alias: gateclientset
        - pkg: sigs.k8s.io/gateway-api/pkg/client/informers/gateway/externalversions
          alias: gateinformers
        - pkg: sigs.k8s.io/gateway-api/apis/v1alpha2
          alias: gatev1alpha2
    misspell:
      locale: US
    mnd:
      ignored-numbers:
        - '2'
    revive:
      rules:
        - name: struct-tag
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: if-return
        - name: increment-decrement
        - name: var-naming
          arguments:
            - [ ] # AllowList
            - [ ] # DenyList
            - - skip-package-name-checks: true
        - name: var-declaration
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
          disabled: true
        - name: unreachable-code
        - name: redefines-builtin-id
    tagalign:
      align: true
      sort: true
      order:
        - description
        - json
        - toml
        - yaml
        - yml
        - label
        - label-slice-as-struct
        - file
        - kv
        - export
    usestdlibvars:
      http-method: true
      http-status-code: true
      time-date-month: true
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true
    usetesting:
      os-create-temp: true
      os-mkdir-temp: true
      os-setenv: true
      os-temp-dir: true
      os-chdir: true
      context-background: true
      context-todo: true
    unconvert:
      fast-math: true
      safe: true
    testifylint:
      disable:
        - suite-dont-use-pkg
        - require-error
        - go-require
    perfsprint:
      integer-format: true
      int-conversion: true
      error-format: true
      err-error: true
      errorf: true
      string-format: true
      sprintf1: true
      strconcat: true
      bool-format: true
      hex-format: true
    sloglint:
      kv-only: false
      attr-only: true
      no-mixed-args: true
      no-global: ""
      context: scope
      msg-style: capitalized
      key-naming-case: camel
      args-on-sep-lines: true
    staticcheck:
      checks:
        - all
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - comments
      - std-error-handling
    rules:
      - path: (.+)_test.go
        linters:
          - canonicalheader
          - fatcontext
          - funlen
          - goconst
          - godot
          - errcheck
          - dupl
      - path: (.+)_test.go
        text: ' always receives '
        linters:
          - unparam
      - linters:
          - revive
        path: 'utils?/*'
        text: 'var-naming: avoid meaningless package names'
      - path: main.go
        text: 'Do not use os.Exit — handle errors gracefully instead.'
        linters:
          - forbidigo
      # Plugin contracts below are consumed cross-package (cmd, sync, tests)
      # rather than referenced by name in this package, so iface's
      # in-package "unused" check cannot see them. OPS-529 tier adaptation.
      - path: internal/plugins/interfaces\.go$
        text: 'unused: interface'
        linters: [iface]
      # SyncStats/SyncResult are the CLI JSON report shape (PascalCase wire
      # format, covered by tests in cmd/mailvault and internal/sync); tagging
      # them with their default names preserves the wire format. Wire-compat,
      # mirrors the result.go exclusion.
      - path: internal/sync/engine\.go$
        text: 'json\(snake\)'
        linters: [tagliatelle]
      # Config structs encode PascalCase names in the list JSON output;
      # the snake YAML keys above are the established config file format.
      # Wire-compat.
      - path: internal/config/config\.go$
        text: 'json\(snake\)'
        linters: [tagliatelle]
      # The PascalCase mirrors in these tests decode the CLI report wire
      # format, so their tags must use the producer keys. Wire-compat.
      - path: cmd/mailvault/reporting_test\.go$
        text: 'json?\(snake\)'
        linters: [tagliatelle]
      - path: cmd/mailvault/cancellation_test\.go$
        text: 'json?\(snake\)'
        linters: [tagliatelle]
      - path: internal/sync/reporting_test\.go$
        text: 'json?\(snake\)'
        linters: [tagliatelle]
      - path: internal/sync/result\.go$
        text: 'json\(snake\)'
        linters: [tagliatelle]
      # `oauth2` is the established user-facing YAML key (config.example.yaml,
      # docs/oauth.md); tagliatelle's snake rule wants `o_auth2`. Wire-compat.
      - path: internal/config/config\.go$
        text: 'yaml\(snake\)'
        linters: [tagliatelle]

output:
  sort-order:
    - file
    - severity
    - linter
  show-stats: true
