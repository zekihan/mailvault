name: mailvault-proton

x-bridge: &bridge
  image: ghcr.io/zekihan/protonmailbridge:3.27.1@sha256:266811f4c5902a746b152fe14b93aaac12c25d65d26faffb6a08bceffd0026d6
  volumes:
    - bridge-state:/root
    - bridge-certs:/bridge-certs

services:
  bridge-init:
    <<: *bridge
    profiles: [tools]
    command: [init]
    stdin_open: true
    tty: true

  bridge:
    <<: *bridge
    command: [serve]
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "bash", "-c", "test -s /bridge-certs/cert.pem && exec 3<>/dev/tcp/127.0.0.1/1143"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  mailvault:
    profiles: [tools]
    build: .
    network_mode: service:bridge
    depends_on:
      bridge:
        condition: service_healthy
    env_file:
      - path: .env.proton
        required: false
    environment:
      SSL_CERT_FILE: /bridge-certs/cert.pem
    entrypoint: ["sh", "/setup/mailvault.sh"]
    command: [sync]
    volumes:
      - mailvault-state:/state
      - mailvault-backups:/backups
      - bridge-certs:/bridge-certs:ro
      - ./deploy/proton/mailvault.yaml:/config/mailvault.yaml:ro
      - ./deploy/proton/mailvault.sh:/setup/mailvault.sh:ro
    secrets:
      - bridge-password

secrets:
  bridge-password:
    file: ./secrets/proton-bridge-password

volumes:
  bridge-state:
  bridge-certs:
  mailvault-state:
  mailvault-backups:
